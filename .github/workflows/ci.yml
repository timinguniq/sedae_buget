name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.1
          cache: true

      - name: Install dependencies
        run: flutter pub get

      # .env는 gitignore된 필수 asset이다. 테스트는 값을 읽지 않으므로 자리만 만든다.
      - name: Create placeholder .env
        run: touch .env

      - name: Harness self-tests
        run: python3 -m unittest discover -s tool/test -p '*_test.py' -v

      # 로컬 pre-commit 훅과 같은 게이트(분석 + 전체 테스트 + 레이어 규칙).
      # 깨끗한 체크아웃에서는 인덱스가 체크아웃한 커밋과 같으므로 그 커밋 전체를 검사한다.
      - name: Commit gate
        run: bash tool/commit_gate.sh
